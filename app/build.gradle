apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.ficamotor'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.ficamotor.app'
        minSdk 24
        targetSdk 34
        def localProps = rootProject.file("local.properties")
        def mapsKey = "YOUR_GOOGLE_MAPS_API_KEY"
        if (localProps.exists()) {
            def p = new Properties()
            p.load(new FileInputStream(localProps))
            mapsKey = p.getProperty("MAPS_API_KEY", mapsKey)
        }
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsKey}\""
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("${rootProject.projectDir}/CMakeLists.txt")
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs 'src/main/java', "${rootProject.projectDir}/platform/android/src"
            res.srcDirs 'src/main/res', "${rootProject.projectDir}/platform/android/res"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.android.billingclient:billing-ktx:6.1.0'
}
